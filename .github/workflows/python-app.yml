# CI: install deps, lint/test (if present), build with Nuitka and upload artifact
name: CI / Build (Nuitka)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-cache-${{ matrix.python-version }}-

      - name: Install build dependencies & runtime deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # install nuitka and PySide6 (fix earlier typo 'nuitika' -> 'nuitka')
          python -m pip install nuitka pyside6
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Lint (optional)
        run: |
          # Run flake8 if any python files or config suggests linting; don't fail the job by default
          if [ -f setup.cfg ] || [ -f tox.ini ] || ls *.py >/dev/null 2>&1 || [ -d modules ]; then
            python -m pip install flake8
            flake8 || true
          else
            echo "No linting configured; skipping."
          fi

      - name: Run tests (if present)
        run: |
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1 || ls *_test.py >/dev/null 2>&1; then
            python -m pip install pytest
            pytest -q
          else
            echo "No tests found — skipping"
          fi

      - name: Build with Nuitka
        run: |
          # Ensure a clean dist dir
          rm -rf dist || true
          mkdir -p dist
          # Use Nuitka to build standalone onefile executable, enable pyside6 plugin
          # Adjust options as needed: remove --onefile for directory-based standalone builds.
          python -m nuitka --standalone --onefile --enable-plugin=pyside6 --remove-output --output-dir=dist main.py
          ls -la dist || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-build-${{ matrix.python-version }}
          path: dist

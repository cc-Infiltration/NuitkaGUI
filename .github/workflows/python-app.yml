# CI: 多平台 Nuitka 构建 + smoke test
# Windows (3.12 MinGW64 / 3.13 MSVC) · Linux (3.13 gcc)
name: CI / Build (Nuitka)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: '3.12'
            compiler-hint: 'mingw64'
            nuitka-compiler-flag: '--mingw64'
            windows-flags: '--windows-console-mode=disable --windows-icon-from-ico=a.ico'
            artifact-suffix: 'win-py3.12-mingw'
            exe-name: 'NuitkaGUI.exe'
            icon-flag: '--include-data-files=a.ico=a.ico'
            needs-vcvars: false

          - os: windows-latest
            python-version: '3.13'
            compiler-hint: 'msvc'
            nuitka-compiler-flag: ''
            windows-flags: '--windows-console-mode=disable --windows-icon-from-ico=a.ico'
            artifact-suffix: 'win-py3.13-msvc'
            exe-name: 'NuitkaGUI.exe'
            icon-flag: '--include-data-files=a.ico=a.ico'
            needs-vcvars: true

          - os: ubuntu-24.04
            python-version: '3.13'
            compiler-hint: 'gcc'
            nuitka-compiler-flag: ''
            windows-flags: ''
            artifact-suffix: 'linux-py3.13-gcc'
            exe-name: 'NuitkaGUI'
            icon-flag: ''
            needs-vcvars: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ---- Linux: 装 gcc + zlib1g-dev ----
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential zlib1g-dev

      # ---- Windows 3.13: 设置 MSVC 编译器环境 (VsDevCmd) ----
      # GitHub Actions runner 自带 MSVC, 但 cl.exe 不在默认 PATH,
      # 必须 Source VsDevCmd.bat 才能用。
      - name: Init MSVC environment (Windows 3.13)
        if: runner.os == 'Windows' && matrix.needs-vcvars
        shell: pwsh
        run: |
          # 用 vswhere 找到最新 VS 的 VsDevCmd.bat
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw "MSVC not found via vswhere" }
          Write-Host "VS install: $installPath"

          # 用 cmd 跑 VsDevCmd.bat 然后导出环境变量到当前 PowerShell
          $vsdevCmd = Join-Path $installPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsdevCmd)) { throw "VsDevCmd.bat not found at $vsdevCmd" }

          $tempFile = [System.IO.Path]::GetTempFileName()
          cmd /c "`"$vsdevCmd`" -arch=x64 -host_arch=x64 && set > `"$tempFile`""
          Get-Content $tempFile | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                  Set-Item -Path "Env:$($matches[1])" -Value $matches[2]
              }
          }
          Remove-Item $tempFile -Force

          # 验证
          cl
          if ($LASTEXITCODE -ne 0) { throw "cl.exe not available after VsDevCmd" }

      # ---- Windows 3.12: winget 装 MSYS2 MinGW64 ----
      - name: Install MinGW64 (Windows 3.12)
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: pwsh
        run: |
          winget install -e --id MSYS2.MSYS2 --accept-package-agreements --accept-source-agreements
          $env:Path = "C:\msys64\mingw64\bin;" + $env:Path
          gcc --version

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- Lint ----
      - name: Lint (flake8, 非阻断)
        run: |
          pip install flake8
          flake8 --max-line-length=100 --extend-ignore=E501,W503,E265,E303,E305,E127,E741 . ; exit 0

      # ---- Python smoke test ----
      - name: Smoke test — py_compile + import modules
        run: |
          python -c "
          import py_compile, glob, sys
          files = glob.glob('modules/*.py') + ['main.py']
          failed = False
          for f in files:
              try:
                  py_compile.compile(f, doraise=True)
                  print(f'  OK  {f}')
              except py_compile.PyCompileError as e:
                  print(f'  FAIL {f}: {e}')
                  failed = True
          if failed: sys.exit(1)
          import sys, os
          sys.path.insert(0, '.')
          from modules import config, deps, builder
          print(f'  import OK — config keys={len(config.DEFAULT_CONFIG)}, platform={os.name}')
          "

      # ---- Nuitka 构建 (PowerShell: 单行, 用 --% stop-parsing 避免 $ 被展开) ----
      - name: Build with Nuitka (standalone + onefile)
        shell: pwsh
        run: |
          python -m nuitka --standalone --onefile --enable-plugin=pyside6 --assume-yes-for-downloads --jobs=4 ${{ matrix.nuitka-compiler-flag }} ${{ matrix.windows-flags }} ${{ matrix.icon-flag }} --output-filename=${{ matrix.exe-name }} --output-dir=dist main.py

      # ---- Windows 验证 ----
      - name: Verify artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist\NuitkaGUI.exe"
          if (-not (Test-Path $exe)) { throw "FAIL: dist\NuitkaGUI.exe 不存在" }
          $item = Get-Item $exe
          Write-Host "OK dist\NuitkaGUI.exe — $([math]::Round($item.Length/1MB,1)) MB, $($item.LastWriteTime)"

      # ---- Linux 验证 ----
      - name: Verify artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN="dist/NuitkaGUI"
          [ -f "$BIN" ] || { echo "FAIL: dist/NuitkaGUI 不存在"; exit 1; }
          echo "OK dist/NuitkaGUI — $(du -h $BIN | cut -f1)"
          file "$BIN" | grep -q "ELF" || { echo "FAIL: 不是 ELF"; exit 1; }
          ldd "$BIN" | grep "not found" && echo "WARN: 有未解析的动态库" || echo "OK: 动态库全部解析"

      # ---- Linux smoke run ----
      - name: Smoke run — xvfb 启动 2 秒 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          timeout 6 xvfb-run -a ./dist/NuitkaGUI || true

      # ---- Windows smoke run ----
      - name: Smoke run — 启动 3 秒 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\NuitkaGUI.exe" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
              Write-Host "OK 启动后 3 秒仍存活"
          } else {
              Write-Host "WARN 进程提前退出 (exit $($proc.ExitCode))"
          }

      # ---- Upload ----
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: NuitkaGUI-${{ matrix.artifact-suffix }}
          path: dist/${{ matrix.exe-name }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload standalone dir
        uses: actions/upload-artifact@v7
        with:
          name: NuitkaGUI-standalone-${{ matrix.artifact-suffix }}
          path: dist/main.dist
          if-no-files-found: ignore
          retention-days: 7

# CI: install deps, build a Windows onefile executable with Nuitka, upload artifact
name: CI / Build (Nuitka)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 支持手动触发构建

permissions:
  contents: read

jobs:
  build:
    # 本项目产物是 Windows exe，Nuitka 需在目标平台构建，故用 windows-latest
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.12, 3.13]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (optional, non-fatal)
        run: |
          $hasLintConfig = (Test-Path setup.cfg -PathType Leaf) -or (Test-Path tox.ini -PathType Leaf)
          $hasPyFiles = (Get-ChildItem -Filter *.py -ErrorAction SilentlyContinue) -or (Test-Path modules -PathType Container)
          if ($hasLintConfig -or $hasPyFiles) {
            pip install flake8
            flake8 --exit-zero .
          } else {
            Write-Host "No linting configured; skipping."
          }

      - name: Run tests (if present)
        run: |
          $hasTests = (Test-Path tests -PathType Container) -or (Get-ChildItem -Filter test_*.py -ErrorAction SilentlyContinue) -or (Get-ChildItem -Filter *_test.py -ErrorAction SilentlyContinue)
          if ($hasTests) {
            pip install pytest
            pytest -q
          } else {
            Write-Host "No tests found - skipping"
          }

      - name: Build with Nuitka (onefile, no console, with icon)
        run: |
          python -m nuitka --standalone --onefile --enable-plugin=pyside6 `
            --windows-console-mode=disable --windows-icon-from-ico=a.ico `
            --include-data-files=a.ico=a.ico --output-filename=NuitkaGUI `
            --output-dir=dist --jobs=4 --assume-yes-for-downloads main.py

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path dist\NuitkaGUI.exe -PathType Leaf)) {
            throw "Build failed: dist\NuitkaGUI.exe not found"
          }
          Get-Item dist\NuitkaGUI.exe | Select-Object Name, Length, LastWriteTime

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: NuitkaGUI-win-py${{ matrix.python-version }}
          path: dist/NuitkaGUI.exe
          if-no-files-found: error

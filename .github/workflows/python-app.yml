# CI: Windows/Linux 双端测试
name: CI / Build (Nuitka)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: '3.12'
            nuitka-compiler-flag: '--mingw64'
            needs-vcvars: false
          - os: windows-latest
            python-version: '3.13'
            nuitka-compiler-flag: ''
            needs-vcvars: true
          - os: ubuntu-24.04
            python-version: '3.13'
            nuitka-compiler-flag: ''
            needs-vcvars: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Linux: gcc + zlib1g-dev
      - name: apt build-essential
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential zlib1g-dev

      # Windows 3.13: 注入 VsDevCmd 环境变量让 cl.exe 可用
      - name: init MSVC env
        if: runner.os == 'Windows' && matrix.needs-vcvars
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw "MSVC not found" }
          $vsdevCmd = Join-Path $installPath "Common7\Tools\VsDevCmd.bat"
          $tmp = [System.IO.Path]::GetTempFileName()
          cmd /c "`"$vsdevCmd`" -arch=x64 -host_arch=x64 && set > `"$tmp`""
          Get-Content $tmp | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "Env:$($matches[1])" -Value $matches[2] }
          }
          Remove-Item $tmp -Force
          cl

      # Windows 3.12: Nuitka 不再自动下 MinGW64, 手动装
      - name: install MinGW64
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: pwsh
        run: |
          winget install -e --id MSYS2.MSYS2 --accept-package-agreements --accept-source-agreements
          $env:Path = "C:\msys64\mingw64\bin;" + $env:Path
          gcc --version

      - name: pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 非阻断
      - name: flake8
        run: |
          pip install flake8
          flake8 --max-line-length=100 --extend-ignore=E501,W503,E265,E303,E305,E127,E741 . ; exit 0

      # 语法 + import
      - name: smoke test
        run: |
          python -c "
          import py_compile, glob, sys
          for f in glob.glob('modules/*.py') + ['main.py']:
              py_compile.compile(f, doraise=True)
          sys.path.insert(0, '.')
          from modules import config, deps, builder
          print('OK — all modules importable')
          "

      - name: nuitka build
        shell: pwsh
        run: |
          $exeName = if ('${{ runner.os }}' -eq 'Linux') { 'NuitkaGUI' } else { 'NuitkaGUI.exe' }
          $winFlags = if ('${{ runner.os }}' -eq 'Linux') { '' } else { '--windows-console-mode=disable --windows-icon-from-ico=a.ico --include-data-files=a.ico=a.ico' }
          python -m nuitka --standalone --onefile --enable-plugin=pyside6 --assume-yes-for-downloads --jobs=4 ${{ matrix.nuitka-compiler-flag }} $winFlags --output-filename=$exeName --output-dir=dist main.py

      # ---- 验证 ----
      - name: verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Test-Path dist\NuitkaGUI.exe || throw "FAIL: exe not found"
          (Get-Item dist\NuitkaGUI.exe).Length / 1MB

      - name: verify (Linux)
        if: runner.os == 'Linux'
        run: |
          test -f dist/NuitkaGUI || { echo "FAIL"; exit 1; }
          file dist/NuitkaGUI | grep -q ELF
          ldd dist/NuitkaGUI | grep "not found" || true

      # ---- 启动测试 ----
      - name: smoke run (Linux xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          timeout 6 xvfb-run -a ./dist/NuitkaGUI || true

      - name: smoke run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\NuitkaGUI.exe -PassThru -WindowStyle Hidden
          Start-Sleep 3
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - uses: actions/upload-artifact@v7
        with:
          name: NuitkaGUI-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist
          if-no-files-found: error
          retention-days: 7
